services:
  - type: web
    name: zkp-demo
    runtime: docker
    branch: fifth
    dockerfilePath: ./Dockerfile.render
    plan: free
    region: singapore
    healthCheckPath: /api/config
    envVars:
      # Google OAuth Client ID (Web application) — giá trị công khai, vốn lộ trong HTML của mọi
      # trang dùng Google Sign-In nên để thẳng trong Blueprint được. Client ID này phải có
      # https://zkp-demo.onrender.com trong Authorized JavaScript origins, và OAuth consent screen
      # phải ở trạng thái đã publish thì mọi tài khoản Gmail mới đăng nhập được (còn ở "Testing"
      # thì chỉ các email nằm trong danh sách test user).
      - key: GOOGLE_CLIENT_ID
        value: 1028971535978-3g72nvqu2j8j4e09atps2fsarjv8n4fv.apps.googleusercontent.com
      # Tuỳ chọn: JSON object thêm domain email công ty được chấp nhận ở Verifier Portal, ngoài
      # mặc định {"ntq-solution.com.vn": "NTQ Solution"}.
      - key: VERIFIER_TRUSTED_DOMAINS_JSON
        sync: false
      # Render tự tạo secret truy cập cổng /issuer; xem giá trị trong Dashboard.
      - key: ISSUER_PORTAL_TOKEN
        generateValue: true
      - key: WEBAUTHN_RP_ID
        value: zkp-demo-53g9.onrender.com
      - key: WEBAUTHN_ORIGIN
        value: https://zkp-demo-53g9.onrender.com
      # Seed sinh khoá CL của issuer. Render sinh một lần rồi giữ nguyên qua các lần deploy, nên
      # khoá ký credential tái tạo được dù gói free không có ổ đĩa bền.
      # QUAN TRỌNG nếu bật phần chain bên dưới: khoá công khai trên chain là BẤT BIẾN, nên seed ở
      # đây phải đúng seed đã dùng lúc công bố credential definition. Seed khác nghĩa là issuer ký
      # bằng một khoá khác khoá trên chain, và mọi proof sẽ bị từ chối. Kiểm bằng
      # GET /api/chain — trường matches_local_key phải là true.
      - key: ISSUER_CL_KEY_SEED
        generateValue: true

      # --- Chain (tuỳ chọn; để trống thì demo chạy hoàn toàn off-chain) ---
      # Không đặt bốn biến dưới đây thì chain tắt: verifier đọc schema và khoá công khai từ file
      # cục bộ của issuer, ba vai vẫn chạy đủ. Đây là mặc định an toàn cho Render.
      #
      # Muốn bật, đặt CẢ BỐN cùng lúc, và chỉ sau khi registry đã được công bố từ một máy có ổ đĩa
      # bền (xem README). Lấy ba giá trị id trong contracts/deployment.json của máy đó.
      - key: SEPOLIA_RPC_URL
        sync: false
      - key: CREDENTIAL_REGISTRY_ADDRESS
        sync: false
      - key: SCHEMA_ID
        sync: false
      - key: CREDENTIAL_DEFINITION_ID
        sync: false

      # Phải là "false" trên Render. Gói free không có ổ đĩa bền, nên nhật ký công bố
      # (contracts/issuer-publication.json) mất sau mỗi lần deploy hoặc service ngủ dậy. Để "true"
      # cùng với ISSUER_PRIVATE_KEY thì mỗi lần khởi động lại nó lại thấy "chưa công bố" và
      # DEPLOY MỘT CONTRACT MỚI. Việc công bố phải làm một lần, ở nơi giữ được nhật ký.
      - key: AUTO_PUBLISH_REGISTRY
        value: "false"
      # ISSUER_PRIVATE_KEY có chủ ý không nằm ở đây: không có khoá ký giao dịch thì backend này
      # không thể ghi lên chain, dù holder eKYC bao nhiêu lần. Nó chỉ đọc.
