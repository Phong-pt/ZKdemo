services:
  zkp-demo:
    build: .
    container_name: zkp-demo

  api:
    build: .
    container_name: zkp-api
    command: ["python", "-m", "uvicorn", "api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      VERIFIER_TRUSTED_DOMAINS_JSON: "${VERIFIER_TRUSTED_DOMAINS_JSON:-}"
      ISSUER_PORTAL_TOKEN: "${ISSUER_PORTAL_TOKEN:-issuer-demo-local}"
      WEBAUTHN_RP_ID: "${WEBAUTHN_RP_ID:-localhost}"
      WEBAUTHN_ORIGIN: "${WEBAUTHN_ORIGIN:-http://localhost:8080,https://localhost:8443}"
      SEPOLIA_RPC_URL: "${SEPOLIA_RPC_URL:-}"
      ISSUER_PRIVATE_KEY: "${ISSUER_PRIVATE_KEY:-}"
      CREDENTIAL_REGISTRY_ADDRESS: "${CREDENTIAL_REGISTRY_ADDRESS:-}"
      SCHEMA_ID: "${SCHEMA_ID:-}"
      CREDENTIAL_DEFINITION_ID: "${CREDENTIAL_DEFINITION_ID:-}"
      # Khoá CL của issuer sinh tất định từ seed này. Thiếu nó thì mỗi lần tạo lại container là
      # một khoá mới, và khoá đã công bố trên chain không còn khớp khoá đang ký.
      ISSUER_CL_KEY_SEED: "${ISSUER_CL_KEY_SEED:-}"
      AUTO_PUBLISH_REGISTRY: "${AUTO_PUBLISH_REGISTRY:-true}"
    volumes:
      - ./issuer:/app/issuer
      - ./wallet:/app/wallet
      - ./contracts:/app/contracts
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    container_name: zkp-frontend
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      - api
